#
# What items break down into with '/goop station deconstruct <player> <slot> ...'.
#
#   Match: a GooP item filter. 'v MATERIAL 0' for vanilla items, 'm TYPE ID' for MMOItems,
#          '*' wildcards allowed ('v *_SWORD 0', 'm SWORD *').
#   Outputs: items produced for EACH item in the stack.
#     Item:   a GooP item filter ('v IRON_INGOT 0', 'm MATERIAL STEEL_INGOT')
#     Amount: '2' or a range '1..3'
#     Chance: percent, default 100
#
# The first table that matches is used.
#
Tables:
  iron_tools:
    Match: "v IRON_* 0"
    Outputs:
      - Item: "v IRON_NUGGET 0"
        Amount: "3..6"
      - Item: "v IRON_INGOT 0"
        Amount: 1
        Chance: 25
  diamond_tools:
    Match: "v DIAMOND_* 0"
    Outputs:
      - Item: "v DIAMOND 0"
        Amount: 1
        Chance: 50
