name: Release

# Pushing a tag such as v2.0.0 or v2.0.0-beta.2 builds both editions, checks them against every
# supported API and publishes a GitHub release with the jars, their SHA-256 sums and the matching
# CHANGELOG.md section. Tags with a '-' suffix are published as pre-releases.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check the tag matches the project version
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $VERSION"; exit 1
          fi

      - name: Build and unit test
        run: mvn -B verify

      - name: API compatibility matrix
        run: sh tools/compat/check-matrix.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd dist && sha256sum *.jar > SHA256SUMS.txt && cd ..
          # The CHANGELOG section for this version, up to the next "## " heading
          awk -v v="$VERSION" '/^## /{p = index($0, "## " v) == 1; next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          PRE=""; case "$VERSION" in *-*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/*.jar dist/SHA256SUMS.txt \
            --title "GooP $VERSION" --notes-file notes.md $PRE
